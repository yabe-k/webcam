        // ステップ値の簡易同期
        function updateStepValue(stepId, key, value) {
            const step = programSteps.find(s => s.id === stepId);
            if (step) {
                step[key] = value;
                if (key === 'loopCount') {
                    updateStepLoopVisuals();
                }
            }
        }

        // 動画撮影用時間の同期 (分・秒 → トータル秒)
        function updateRecordDuration(stepId) {
            const step = programSteps.find(s => s.id === stepId);
            if (step) {
                const min = parseInt(document.getElementById(`step-rec-m-${stepId}`).value) || 0;
                const sec = parseInt(document.getElementById(`step-rec-s-${stepId}`).value) || 0;
                step.duration = (min * 60) + sec;
            }
        }

        // ループの視覚的配置 (インデント) の最適化
        function updateStepLoopVisuals() {
            let indentActive = false;
            programSteps.forEach((step) => {
                const card = document.getElementById(`step-card-${step.id}`);
                if (!card) return;

                if (step.type === 'loop_start') {
                    card.classList.remove('in-loop');
                    indentActive = true;
                } else if (step.type === 'loop_end') {
                    indentActive = false;
                    card.classList.remove('in-loop');
                } else {
                    if (indentActive) {
                        card.classList.add('in-loop');
                    } else {
                        card.classList.remove('in-loop');
                    }
                }
            });
        }


        /* 非同期シーケンス実行エンジン (コアロジック) */

        // 実行ボタンクリックのトグル
        async function toggleProgram() {
            if (isProgramRunning) {
                stopProgram();
            } else {
                await startProgram();
            }
        }

        // プログラムの起動
        async function startProgram() {
            if (programSteps.length === 0) {
                alert("シーケンスプログラムにステップがありません。");
                return;
            }

            // 実行状態にUIを変更
            isProgramRunning = true;
            shouldStopProgram = false;
            activeMediaRecorders = [];

            const runBtn = document.getElementById('btn-run-program');
            runBtn.innerHTML = `
                <span class="preview-status recording" style="display:inline-block; width:10px; height:10px; margin-right:4px;"></span>
                実行中
            `;
            runBtn.classList.replace('btn-success', 'btn-warning');
            
            document.getElementById('btn-stop-program').disabled = false;
            disableEditorUi(true); // 実行中はエディターの再構成ボタンをガード

            log("====== 撮影プログラム実行開始 ======", 'info');
            playSynthesizedSound('start');

            try {
                activeProgramPromise = runEngineLoop();
                await activeProgramPromise;
            } catch (err) {
                log(`プログラムが例外エラーで異常終了しました: ${err.message}`, 'error');
            } finally {
                // 終了後のリセット
                resetProgramUi();
                playSynthesizedSound('stop');
            }
        }

        // 実行エンジンの終了処理
        function stopProgram() {
            if (!isProgramRunning) return;
            
            log("🛑 プログラムの停止要求を受信しました。処理を強制終了しています...", 'warning');
            shouldStopProgram = true;

            // 動作中の MediaRecorder を一括停止
            activeMediaRecorders.forEach((rec) => {
                if (rec.state === 'recording') {
                    rec.stop();
                }
            });
            activeMediaRecorders = [];
        }

        // UIコントロールのリセット
        function resetProgramUi() {
            isProgramRunning = false;
            activeProgramPromise = null;

            const runBtn = document.getElementById('btn-run-program');
            runBtn.innerHTML = `
                <svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                プログラム実行
            `;
            runBtn.classList.replace('btn-warning', 'btn-success');

            document.getElementById('btn-stop-program').disabled = true;
            disableEditorUi(false);

            // すべてのハイライト表示を取り消す
            document.querySelectorAll('.step-card').forEach(card => card.classList.remove('executing'));
        }

        // 実行中に不要なボタンをロックするヘルパー
        function disableEditorUi(disabled) {
            document.getElementById('btn-add-camera').disabled = disabled;
            document.querySelectorAll('#sidebar select, #sidebar input').forEach(el => el.disabled = disabled);
            document.querySelectorAll('.step-card button').forEach(el => el.disabled = disabled);
            document.querySelectorAll('.camera-card button').forEach(el => el.disabled = disabled);
        }

        // プログラム全体の非同期ループ処理 (インタープリタ)
        async function runEngineLoop() {
            let pc = 0; // プログラムカウンタ
            let loopStack = []; // ループ処理用スタック [{ pc, count, maxCount }]

            while (pc < programSteps.length) {
                if (shouldStopProgram) {
                    log("プログラムの強制停止を実行しました。", 'warning');
                    break;
                }

                const step = programSteps[pc];
                
                // 実行ステップのハイライト処理
                document.querySelectorAll('.step-card').forEach(card => card.classList.remove('executing'));
                const stepCard = document.getElementById(`step-card-${step.id}`);
                if (stepCard) {
                    stepCard.classList.add('executing');
                    // 自動スクロールして見える位置に収める
                    stepCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }

                log(`[ステップ ${pc + 1}/${programSteps.length}] ${step.type.toUpperCase()} を実行中...`);

                // 各コマンド処理
                if (step.type === 'capture') {
                    // 静止画撮影 (プレビューがONでない場合は最速起動)
                    const cam = activeCameras.find(c => c.id === step.cameraId);
                    if (cam) {
                        await cam.capture();
                    } else {
                        log(`カメラ ID "${step.cameraId}" が見つかりません。スキップします。`, 'error');
                    }
                    pc++;
                } 
                else if (step.type === 'record') {
                    // 動画録画 (プレビューがONでない場合は最速起動)
                    const cam = activeCameras.find(c => c.id === step.cameraId);
                    if (cam) {
                        const ok = await cam.startRecording();
                        if (ok) {
                            // 録画時間中待機 (1秒ごとに停止シグナルを確認)
                            const durationMs = step.duration * 1000;
                            const checkInterval = 200;
                            let elapsed = 0;
                            
                            log(`${cam.name} 録画完了予定時間まで待機します: ${step.duration}秒`);
                            while (elapsed < durationMs && !shouldStopProgram) {
                                await sleep(checkInterval);
                                elapsed += checkInterval;
                            }
                            cam.stopRecording();
                            await sleep(2200); // メディアの圧縮・保存遅延をカバー
                        } else {
                            // カメラの起動や録画開始に失敗した場合、同等のスリープを実行
                            log(`⚠️ ${cam.name} の起動または録画開始に失敗しました。時間調整のため、録画時間と同等の待機を行います: ${step.duration}秒`, 'warning');
                            const durationMs = step.duration * 1000;
                            const checkInterval = 200;
                            let elapsed = 0;
                            while (elapsed < durationMs && !shouldStopProgram) {
                                await sleep(checkInterval);
                                elapsed += checkInterval;
                            }
                        }
                    } else {
                        // カメラが存在しない場合、同等のスリープを実行
                        log(`❌ カメラ ID "${step.cameraId}" が見つかりません。時間調整のため、録画時間と同等の待機を行います: ${step.duration}秒`, 'error');
                        const durationMs = step.duration * 1000;
                        const checkInterval = 200;
                        let elapsed = 0;
                        while (elapsed < durationMs && !shouldStopProgram) {
                            await sleep(checkInterval);
                            elapsed += checkInterval;
                        }
                    }
                    pc++;
                } 
                else if (step.type === 'preview_on') {
                    // プレビューON (必ず5秒間待機する)
                    const cam = activeCameras.find(c => c.id === step.cameraId);
                    if (cam) {
                        log(`[${cam.name}] プレビューをONにします。起動および安定化待機を開始します (5.0秒固定)...`, 'info');
                        await cam.startPreview();
                        
                        const waitTime = 5000; // 必ず5秒間かかる仕様
                        const checkInterval = 200;
                        let elapsed = 0;
                        while (elapsed < waitTime && !shouldStopProgram) {
                            await sleep(checkInterval);
                            elapsed += checkInterval;
                        }
                        log(`[${cam.name}] プレビューのONおよび5秒間の起動安定化待機が完了しました。`);
                    } else {
                        log(`カメラ ID "${step.cameraId}" が見つかりません。スキップします。`, 'error');
                    }
                    pc++;
                }
                else if (step.type === 'preview_off') {
                    // プレビューOFF (最速でOFF)
                    const cam = activeCameras.find(c => c.id === step.cameraId);
                    if (cam) {
                        log(`[${cam.name}] プレビューをOFFにします。`, 'info');
                        cam.stopPreview();
                    } else {
                        log(`カメラ ID "${step.cameraId}" が見つかりません。スキップします。`, 'error');
                    }
                    pc++;
                }
                else if (step.type === 'sleep') {
                    // スリープ
                    const durationMs = step.sleepTime * 1000;
                    const checkInterval = 200;
                    let elapsed = 0;
                    log(`スリープ待機に入ります: ${step.sleepTime}秒`);
                    while (elapsed < durationMs && !shouldStopProgram) {
                        await sleep(checkInterval);
                        elapsed += checkInterval;
                    }
                    pc++;
                } 
                else if (step.type === 'loop_start') {
                    // ループ開始
                    let currentLoop = loopStack.find(l => l.pc === pc);
                    if (!currentLoop) {
                        currentLoop = {
                            pc: pc,
                            count: step.loopCount,
                            maxCount: step.loopCount
                        };
                        loopStack.push(currentLoop);
                        log(`🔁 ループブロック開始: 計 ${step.loopCount} 回`, 'info');
                    }
                    pc++;
                } 
                else if (step.type === 'loop_end') {
                    // ループ終了
                    if (loopStack.length > 0) {
                        let currentLoop = loopStack[loopStack.length - 1];
                        currentLoop.count--;
                        
                        log(`↩️ ループ反復完了 (残り回数: ${currentLoop.count}/${currentLoop.maxCount})`);

                        if (currentLoop.count > 0 && !shouldStopProgram) {
                            // ループ先頭へジャンプ (loop_start ステップの位置へ)
                            pc = currentLoop.pc;
                        } else {
                            // ループ最大回数に達したためスタックから外して次へ
                            loopStack.pop();
                            log("🔁 ループブロックを完了しました。", 'info');
                            pc++;
                        }
                    } else {
                        log("警告: 対応する 'ループ開始' がない 'ループ終了' を検出しました。無視して進みます。", 'warning');
                        pc++;
                    }
                }

                // 各ステップ終了時の極小遅延 (CPU負荷・描画対策)
                await sleep(100);
            }

            log("====== 撮影プログラム実行終了 ======", 'success');
        }


        /* 音声シンセサイザー (Web Audio API) */

        function playSynthesizedSound(action) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                
                if (action === 'capture') {
                    // プレミアム高音質なシャッターサウンド
                    const bufferSize = ctx.sampleRate * 0.15;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.value = 1500;
                    
                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.4, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                    
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);
                    
                    const osc = ctx.createOscillator();
                    const oscGain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.08);
                    
                    oscGain.gain.setValueAtTime(0.12, ctx.currentTime);
                    oscGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                    
                    osc.connect(oscGain);
                    oscGain.connect(ctx.destination);
                    
                    noise.start();
                    osc.start();
                    noise.stop(ctx.currentTime + 0.15);
                    osc.stop(ctx.currentTime + 0.15);
                } 
                else if (action === 'record_start') {
                    // 電子音「ピピッ」 (録画開始)
                    const now = ctx.currentTime;
                    const osc1 = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(1000, now);
                    osc1.frequency.setValueAtTime(1200, now + 0.08);
                    
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.setValueAtTime(0.15, now + 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    
                    osc1.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc1.start(now);
                    osc1.stop(now + 0.2);
                }
                else if (action === 'record_stop') {
                    // 電子音「ピピポー」 (録画終了)
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.setValueAtTime(1000, now + 0.08);
                    osc.frequency.setValueAtTime(800, now + 0.16);
                    
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.setValueAtTime(0.15, now + 0.16);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(now);
                    osc.stop(now + 0.28);
                }
                else if (action === 'start') {
                    // 起動起動アラートトーン
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                    
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
                else if (action === 'stop') {
                    // 停止・完了トーン
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(783.99, now); // G5
                    osc.frequency.setValueAtTime(523.25, now + 0.15); // C5
                    
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch (err) {
                console.warn("Web Audio はまだインタラクションが無いため制限されています", err);
            }
        }


        /* ユーティリティヘルパー */

        // タイムスタンプ付ログ出力
        function log(message, type = 'normal') {
            const container = document.getElementById('console-logs-container');
            if (!container) return;

            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

            const entry = document.createElement('div');
            entry.className = `log-entry`;
            
            let classType = '';
            if (type === 'error') classType = 'log-error';
            else if (type === 'warning') classType = 'log-error'; // 警告も赤っぽく
            else if (type === 'info') classType = 'log-info';
            else if (type === 'success') classType = 'log-info'; // 緑

            entry.innerHTML = `
                <span class="log-time">[${timeStr}]</span>
                <span class="${classType}">${message}</span>
            `;

            container.appendChild(entry);
            
            // 自動的に一番下までスクロール
            container.scrollTop = container.scrollHeight;

            // ログが多すぎる場合は古いものを削除 (上限100行)
            while (container.childNodes.length > 100) {
                container.removeChild(container.firstChild);
            }
        }

        // ログのクリア
        function clearLogs() {
            const container = document.getElementById('console-logs-container');
            if (container) {
                container.innerHTML = '';
                log("ログモニターをクリアしました。");
            }
        }

        // ミリ秒スリープ Promise
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 日付フォーマット YYYY-MM-DD_hh-mm-ss
        function getFormattedDate() {
            const now = new Date();
            const pad = num => String(num).padStart(2, '0');
            return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
        }
    </script>
